<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StreamGuide</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#07071a;color:#e0e0f0;min-height:100vh}
.header{background:#1a1a2e;color:#e94560;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #e94560;gap:12px;flex-wrap:wrap}
.header-logo{font-size:20px;font-weight:700;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.live-dot{width:10px;height:10px;border-radius:50%;background:#e94560;display:inline-block;animation:blink 1s infinite;flex-shrink:0}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync-status{font-size:11px;color:#6060a0;display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#6060a0;flex-shrink:0}
.sync-dot.connected{background:#4ade80}
.sync-dot.syncing{background:#f0a500;animation:blink .7s infinite}
.header-clock{font-size:13px;color:#a0a0c0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.admin-badge{font-size:10px;background:#e94560;color:#fff;padding:2px 8px;border-radius:2px;letter-spacing:1px;text-transform:uppercase}
.hdr-btn{background:transparent;border:1px solid #3a3a5a;color:#a0a0c0;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:12px;font-family:'Courier New',monospace;transition:all .15s}
.hdr-btn:hover{border-color:#e94560;color:#e94560}
.hdr-btn.primary{background:#e94560;border-color:#e94560;color:#fff}
.hdr-btn.primary:hover{background:#c73550}
.toolbar{background:#16213e;padding:8px 20px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #2a2a4a;flex-wrap:wrap}
.filter-pill{background:transparent;border:1px solid #3a3a5a;color:#a0a0c0;padding:3px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-family:'Courier New',monospace;transition:all .15s;white-space:nowrap}
.filter-pill.active{background:#e94560;border-color:#e94560;color:#fff}
.filter-pill.lang-pill.active{background:#0369a1;border-color:#0369a1}
.filter-pill:hover:not(.active){border-color:#e94560;color:#e94560}
.toolbar-sep{width:1px;height:20px;background:#2a2a4a;flex-shrink:0}
.toolbar-right{margin-left:auto;display:flex;gap:8px}
.refresh-btn{background:transparent;border:1px solid #3a3a5a;color:#a0a0c0;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:12px;font-family:'Courier New',monospace;transition:all .15s}
.refresh-btn:hover{border-color:#e94560;color:#e94560}
.grid-container{overflow-x:auto}
.guide-grid{display:grid;min-width:900px}
.time-header-row{display:flex;background:#16213e;border-bottom:2px solid #2a2a4a;position:sticky;top:0;z-index:10}
.channel-col-header{width:180px;min-width:180px;padding:8px 12px;font-size:11px;color:#6060a0;text-transform:uppercase;letter-spacing:1px;border-right:1px solid #2a2a4a}
.time-slots-header{display:flex;flex:1}
.time-slot-label{flex:1;padding:8px 4px;font-size:11px;color:#6060a0;text-align:center;border-right:1px solid #2a2a4a;min-width:90px}
.channel-row{display:flex;border-bottom:1px solid #2a2a4a;min-height:68px}
.channel-info{width:180px;min-width:180px;background:#0f0f23;border-right:2px solid #2a2a4a;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.channel-name{font-size:13px;font-weight:700;color:#e0e0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.lang-badge{font-size:9px;padding:1px 5px;border-radius:2px;background:#0369a122;color:#60a0d0;border:1px solid #0369a144;text-transform:uppercase;letter-spacing:.5px}
.tag-badge{font-size:9px;padding:1px 5px;border-radius:2px;background:#3a3a5a;color:#a0a0c0;border:1px solid #4a4a6a}
.channel-actions{display:flex;gap:4px;margin-top:3px}
.ch-btn{background:transparent;border:1px solid #2a2a4a;color:#6060a0;padding:1px 6px;border-radius:2px;cursor:pointer;font-size:10px;font-family:'Courier New',monospace;transition:all .15s}
.manage-item{background:#0f0f23;border:1px solid #2a2a4a;border-radius:4px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.manage-item-info{flex:1;min-width:0}
.manage-item-name{font-size:13px;font-weight:700;color:#e0e0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.manage-item-meta{font-size:10px;color:#6060a0;margin-top:2px}
.manage-item-actions{display:flex;gap:6px;flex-shrink:0}
.manage-item-actions .ch-btn[disabled]{pointer-events:none}
.ch-btn:hover{border-color:#e94560;color:#e94560}
.programs-row{flex:1;display:flex;position:relative;background:#0a0a1a}
.program-block{position:absolute;height:58px;border-radius:3px;padding:5px 7px;overflow:hidden;border:1px solid transparent;transition:all .15s;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none}
.program-block:hover{filter:brightness(1.2);border-color:rgba(255,255,255,.3);z-index:5}
.program-block.on-now{box-shadow:0 0 0 2px #e94560;z-index:3}
.program-block.upcoming{opacity:.75}
.program-block.ended{opacity:.3;filter:grayscale(.6)}
.prog-title{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-meta{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-top:2px}
.prog-time{font-size:10px;color:rgba(255,255,255,.7)}
.prog-badge{font-size:9px;font-weight:700;padding:2px 4px;border-radius:2px;text-transform:uppercase;white-space:nowrap}
.badge-live{background:#e94560;color:#fff;animation:blink 1.5s infinite}
.badge-soon{background:#f0a500;color:#000}
.badge-ended{background:#444;color:#aaa}
.countdown{font-size:10px;color:rgba(255,255,255,.85);font-weight:700}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:#e94560;z-index:8;pointer-events:none}
.now-line::before{content:'';position:absolute;top:0;left:-4px;width:10px;height:10px;background:#e94560;border-radius:50%}
.empty-row{flex:1;display:flex;align-items:center;padding-left:12px}
.empty-msg{font-size:11px;color:#3a3a5a;font-style:italic}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1a1a2e;border:1px solid #3a3a5a;border-radius:6px;padding:22px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{color:#e94560;font-size:15px;margin-bottom:6px;letter-spacing:1px}
.modal-subtitle{font-size:11px;color:#6060a0;margin-bottom:14px}
.modal label{display:block;font-size:11px;color:#a0a0c0;margin-bottom:3px;margin-top:10px;text-transform:uppercase;letter-spacing:.5px}
.modal input,.modal select{width:100%;background:#0a0a1a;border:1px solid #3a3a5a;color:#e0e0f0;padding:6px 10px;border-radius:3px;font-family:'Courier New',monospace;font-size:13px;outline:none}
.modal input:focus,.modal select:focus{border-color:#e94560}
.modal select option{background:#1a1a2e}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1;padding:8px;border-radius:3px;cursor:pointer;font-family:'Courier New',monospace;font-size:12px;font-weight:700}
.btn-save{background:#e94560;border:none;color:#fff}
.btn-cancel{background:transparent;border:1px solid #3a3a5a;color:#a0a0c0}
.btn-cancel:hover{border-color:#e94560;color:#e94560}
.fetch-status{font-size:11px;margin-top:8px;padding:5px 9px;border-radius:3px;display:none}
.fetch-status.loading{display:block;background:#16213e;color:#a0a0c0}
.fetch-status.success{display:block;background:#0a2a1a;color:#4ade80;border:1px solid #166534}
.fetch-status.error{display:block;background:#2a0a0a;color:#f87171;border:1px solid #991b1b}
.tags-input-wrap{border:1px solid #3a3a5a;border-radius:3px;background:#0a0a1a;padding:5px 8px;display:flex;flex-wrap:wrap;gap:5px;cursor:text;min-height:38px;align-items:center}
.tags-input-wrap:focus-within{border-color:#e94560}
.tag-chip{background:#3a3a5a;color:#e0e0f0;padding:2px 7px;border-radius:12px;font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tag-chip-remove{cursor:pointer;color:#a0a0c0;font-size:13px;line-height:1}
.tag-chip-remove:hover{color:#e94560}
.tags-input-wrap input{background:transparent;border:none;outline:none;color:#e0e0f0;font-family:'Courier New',monospace;font-size:12px;min-width:100px;flex:1}
.tag-suggestions{background:#0f0f23;border:1px solid #3a3a5a;border-top:none;border-radius:0 0 3px 3px;max-height:120px;overflow-y:auto;display:none}
.tag-suggestion{padding:5px 10px;font-size:12px;cursor:pointer;color:#a0a0c0}
.tag-suggestion:hover{background:#2a2a4a;color:#e0e0f0}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a2e;border:1px solid #3a3a5a;color:#e0e0f0;padding:9px 14px;border-radius:4px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.login-screen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;align-items:center;justify-content:center}
.login-screen.open{display:flex}
.login-box{background:#1a1a2e;border:1px solid #e94560;border-radius:6px;padding:30px;width:320px;text-align:center}
.login-box h2{color:#e94560;font-size:18px;margin-bottom:8px;letter-spacing:2px}
.login-box p{font-size:11px;color:#6060a0;margin-bottom:20px}
.login-box input{width:100%;background:#0a0a1a;border:1px solid #3a3a5a;color:#e0e0f0;padding:8px 12px;border-radius:3px;font-family:'Courier New',monospace;font-size:14px;outline:none;text-align:center;letter-spacing:3px;margin-bottom:12px}
.login-box input:focus{border-color:#e94560}
.login-error{color:#f87171;font-size:11px;margin-top:6px;display:none}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-track{background:#0a0a1a}
::-webkit-scrollbar-thumb{background:#3a3a5a;border-radius:3px}
</style>
</head>
<body>

<script>
const ADMIN_PASSWORD='streamguide2025';
const YT_KEY='AIzaSyD03qfbIFEi_sO6kbew_usxW5oKaSDO7R4';
const RTDB='https://streamguide-490519-default-rtdb.firebaseio.com';

let isAdmin=false,channels=[],nextId=Date.now(),editingId=null,selectedTags=[];
let activeTagF=new Set(['all']),activeLangF=new Set(['all']),currentTab='live';
const now=()=>new Date();
const addMin=(b,m)=>new Date(new Date(b).getTime()+m*60000);
const WMIN=300,SMIN=60,NSLOTS=WMIN/SMIN;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Admin
function openLogin(){document.getElementById('admin-pw-input').value='';document.getElementById('login-error').style.display='none';document.getElementById('login-screen').classList.add('open');setTimeout(()=>document.getElementById('admin-pw-input').focus(),100)}
function closeLogin(){document.getElementById('login-screen').classList.remove('open')}
function checkPassword(){if(document.getElementById('admin-pw-input').value===ADMIN_PASSWORD){isAdmin=true;closeLogin();updateAdminUI();showToast('Admin mode enabled.')}else{document.getElementById('login-error').style.display='block'}}
function logout(){isAdmin=false;updateAdminUI();showToast('Logged out.')}
function updateAdminUI(){
  document.getElementById('admin-badge').style.display=isAdmin?'inline':'none';
  document.getElementById('btn-add-channel').style.display=isAdmin?'inline-block':'none';
  document.getElementById('btn-manage-channels').style.display=isAdmin?'inline-block':'none';
  document.getElementById('btn-oauth-setup').style.display=isAdmin?'inline-block':'none';
  document.getElementById('btn-admin-login').style.display=isAdmin?'none':'inline-block';
  document.getElementById('btn-admin-logout').style.display=isAdmin?'inline-block':'none';
  renderGrid();
}

// Firebase
function setSyncStatus(s,l){document.getElementById('sync-dot').className='sync-dot'+(s?' '+s:'');document.getElementById('sync-label').textContent=l}

// ── Realtime Database REST helpers ──
async function rtdbGet(){
  const r=await fetch(RTDB+'/channels.json');
  if(!r.ok)throw new Error('RTDB read failed: '+r.status);
  return await r.json();
}
async function rtdbSet(id,data){
  const r=await fetch(RTDB+'/channels/'+id+'.json',{method:'PUT',body:JSON.stringify(data)});
  if(!r.ok)throw new Error('RTDB write failed: '+r.status);
  return await r.json();
}
async function rtdbDelete(id){
  const r=await fetch(RTDB+'/channels/'+id+'.json',{method:'DELETE'});
  if(!r.ok)throw new Error('RTDB delete failed: '+r.status);
}

function parseChannel(id,d){
  if(!d)return null;
  d.streams=(d.streams||[]).map(s=>{
    const start=new Date(s.start);
    return{...s,start:isNaN(start)?new Date():start};
  }).filter(s=>!isNaN(s.start));
  d.videos=(d.videos||[]).map(v=>({...v,publishedAt:new Date(v.publishedAt)}));
  d._docId=id;
  return d;
}

function serializeCh(ch){
  const{_docId,...data}=ch;
  return{...data,
    streams:(data.streams||[]).map(s=>({...s,start:new Date(s.start).toISOString()})),
    videos:(data.videos||[]).map(v=>({...v,publishedAt:new Date(v.publishedAt).toISOString()}))
  };
}

async function startSync(){
  setSyncStatus('syncing','connecting...');
  try{
    const raw=await rtdbGet();
    channels=raw?Object.entries(raw).map(([id,d])=>parseChannel(id,d)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)):[];
    setSyncStatus('connected','synced');
    buildFilters();renderGrid();
  }catch(e){
    setSyncStatus('','offline');
    showToast('DB error: '+e.message);
  }
  // Poll every 15 seconds for cross-device sync
  setInterval(async()=>{
    try{
      const raw=await rtdbGet();
      channels=raw?Object.entries(raw).map(([id,d])=>parseChannel(id,d)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)):[];
      setSyncStatus('connected','synced');
      buildFilters();renderGrid();
      }catch(e){setSyncStatus('','offline')}
  },15000);
}

async function saveCh(ch){
  setSyncStatus('syncing','saving...');
  const id=ch._docId||String(ch.id);
  try{
    await rtdbSet(id,serializeCh(ch));
    ch._docId=id;
    setSyncStatus('connected','synced');
    console.log('Save OK:',id);
  }catch(e){
    setSyncStatus('','error');
    showToast('Save error: '+e.message);
    console.error('Save error:',e);
  }
}
async function deleteCh(ch){
  try{await rtdbDelete(ch._docId||String(ch.id))}
  catch(e){showToast('Delete error: '+e.message)}
}

// YouTube
async function resolveId(url){
  url=url.trim().replace(/\/$/,'');
  const im=url.match(/channel\/(UC[\w-]+)/);if(im)return im[1];
  const hm=url.match(/@([\w.-]+)/),um=url.match(/\/user\/([\w.-]+)/);
  let h=hm?hm[1]:um?um[1]:url.replace(/^@/,'').replace(/.*\//,'');
  if(!h)throw new Error('Cannot parse URL');
  const r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${encodeURIComponent(h)}&maxResults=1&key=${YT_KEY}`);
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  if(!d.items?.length)throw new Error('Channel not found');
  return d.items[0].snippet.channelId;
}
async function fetchName(id){
  const r=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${id}&key=${YT_KEY}`);
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  if(!d.items?.length)throw new Error('Channel not found');return d.items[0].snippet.title;
}
// ── YouTube via Netlify proxy ─────────────────────────────────────────────
const PROXY = '/.netlify/functions/youtube';

async function fetchStreams(channelId, bustCache=false, existingStreams=[]) {
  // Pass previously-live stream IDs so the proxy can re-check if they ended
  const prevLiveIds = existingStreams
    .filter(s => s.liveNow)
    .map(s => s.url.split('v=')[1])
    .filter(Boolean)
    .join(',');
  const url = `${PROXY}?channelId=${channelId}${bustCache?'&bust=1':''}${prevLiveIds?'&prevLiveIds='+encodeURIComponent(prevLiveIds):''}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Proxy error: ' + r.status);
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return (data.streams || []).map(s => ({
    ...s,
    id: ++nextId,
    start: new Date(s.start)
  }));
}


// Tags input
function getAllTags(){const s=new Set();channels.forEach(c=>(c.tags||[]).forEach(t=>s.add(t)));return[...s].sort()}
function renderChips(){
  const w=document.getElementById('tags-wrap'),inp=document.getElementById('tag-input');
  w.querySelectorAll('.tag-chip').forEach(e=>e.remove());
  selectedTags.forEach(t=>{const c=document.createElement('span');c.className='tag-chip';c.innerHTML=`${esc(t)}<span class="tag-chip-remove" data-tag="${esc(t)}">x</span>`;w.insertBefore(c,inp)});
}
document.addEventListener('click',e=>{if(e.target.classList.contains('tag-chip-remove')){selectedTags=selectedTags.filter(t=>t!==e.target.dataset.tag);renderChips()}});
function addTagVal(t){t=t.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'');if(!t||selectedTags.includes(t))return;selectedTags.push(t);renderChips();document.getElementById('tag-input').value='';document.getElementById('tag-suggestions').style.display='none'}
function onTagKeydown(e){if(e.key==='Enter'||e.key===','){e.preventDefault();addTagVal(document.getElementById('tag-input').value)}else if(e.key==='Backspace'&&!document.getElementById('tag-input').value&&selectedTags.length){selectedTags.pop();renderChips()}}
function onTagInput(){
  const v=document.getElementById('tag-input').value.trim().toLowerCase();
  const all=getAllTags().filter(t=>t.includes(v)&&!selectedTags.includes(t));
  const b=document.getElementById('tag-suggestions');
  if(!v||!all.length){b.style.display='none';return}
  b.innerHTML=all.map(t=>`<div class="tag-suggestion" onclick="addTagVal('${esc(t)}')">${esc(t)}</div>`).join('');b.style.display='block';
}

// Filters
function buildFilters(){
  const tags=getAllTags();
  const langs=[...new Set(channels.map(c=>c.language).filter(Boolean))].sort();
  document.getElementById('tag-filters').innerHTML=tags.map(t=>`<button class="filter-pill${activeTagF.has(t)?' active':''}" data-type="tag" data-val="${esc(t)}" onclick="toggleFilter(this)">${esc(t)}</button>`).join('');
  document.getElementById('lang-filters').innerHTML=langs.map(l=>`<button class="filter-pill lang-pill${activeLangF.has(l)?' active':''}" data-type="lang" data-val="${esc(l)}" onclick="toggleFilter(this)">${esc(l)}</button>`).join('');
}
function toggleFilter(btn){
  const type=btn.dataset.type,val=btn.dataset.val,set=type==='tag'?activeTagF:activeLangF;
  if(val==='all'){set.clear();set.add('all')}else{set.delete('all');if(set.has(val)){set.delete(val);if(!set.size)set.add('all')}else set.add(val)}
  document.querySelectorAll(`[data-type="${type}"]`).forEach(b=>b.classList.toggle('active',set.has(b.dataset.val)));
  renderGrid();
}
function hasActiveStreams(ch){
  return (ch.streams||[]).some(s=>{
    const st=statusOf(s);
    if(st==='live') return true;
    if(st==='upcoming' && new Date(s.start)<=addMin(now(),WMIN)) return true;
    return false;
  });
}
function chVisible(ch){
  if(ch.frozen) return false;
  const tagOk=activeTagF.has('all')||(ch.tags||[]).some(t=>activeTagF.has(t));
  const langOk=activeLangF.has('all')||activeLangF.has(ch.language);
  return tagOk&&langOk&&hasActiveStreams(ch);
}

// Channel modal
function openChannelModal(id){
  editingId=id||null;selectedTags=[];
  document.getElementById('f-url').value='';document.getElementById('f-lang').value='';clearFetchStatus();
  if(id){const ch=channels.find(c=>c.id===id);if(ch){document.getElementById('f-url').value=ch.channelUrl||'';document.getElementById('f-lang').value=ch.language||'';selectedTags=[...(ch.tags||[])];document.getElementById('modal-ch-title').textContent='Edit Channel';document.getElementById('btn-add').textContent='Update';}}
  else{document.getElementById('modal-ch-title').textContent='Add Channel';document.getElementById('btn-add').textContent='Fetch & Add';}
  renderChips();document.getElementById('modal-channel').classList.add('open');
}
function closeChannelModal(){document.getElementById('modal-channel').classList.remove('open');document.getElementById('tag-suggestions').style.display='none'}
async function submitChannel(){
  const url=document.getElementById('f-url').value.trim(),lang=document.getElementById('f-lang').value,tags=[...selectedTags];
  if(!url){setFetchStatus('error','Please enter a channel URL.');return}
  const btn=document.getElementById('btn-add');btn.disabled=true;btn.textContent='Fetching...';setFetchStatus('loading','Resolving channel...');
  try{
    const channelId=await resolveId(url);
    setFetchStatus('loading','Fetching channel name...');const name=await fetchName(channelId);
    setFetchStatus('loading','Fetching live & upcoming streams...');
    const streams=await fetchStreams(channelId,true);const videos=[];
    let ch=editingId?channels.find(c=>c.id===editingId):channels.find(c=>c.channelId===channelId);
    if(ch){ch.streams=streams;ch.videos=videos;ch.language=lang;ch.tags=tags;ch.channelUrl=url;ch.lastFetched=new Date().toISOString()}
    else ch={id:++nextId,channelId,channelUrl:url,name,language:lang,tags,streams,videos,lastFetched:new Date().toISOString()};
    await saveCh(ch);
    setFetchStatus('success',`"${name}" saved — ${streams.length} stream(s) found.`);
    setTimeout(closeChannelModal,1200);
  }catch(e){setFetchStatus('error','Error: '+e.message)}
  finally{btn.disabled=false;btn.textContent=editingId?'Update':'Fetch & Add'}
}
async function removeChannel(id){
  const ch=channels.find(c=>c.id===id);if(!ch||!confirm(`Remove "${ch.name}"?`))return;
  await deleteCh(ch);showToast(ch.name+' removed.');
}
async function refreshChannel(id){
  const ch=channels.find(c=>c.id===id);if(!ch)return;
  if(ch.frozen){showToast(ch.name+' is frozen — unfreeze it first.');return}
  showToast('Refreshing '+ch.name+'...');
  try{
    const s=await fetchStreams(ch.channelId,true,ch.streams||[]);
    ch.streams=s;ch.lastFetched=new Date().toISOString();
    await saveCh(ch);
    showToast(ch.name+': '+(s.length?s.length+' stream(s) found':'no streams scheduled'));
    renderGrid();
  }catch(e){
    console.error('Refresh error for '+ch.name+':',e);
    // Clear stale streams so ended streams don't keep showing
    ch.streams=[];ch.lastFetched=new Date().toISOString();
    await saveCh(ch);
    renderGrid();
    showToast('Error refreshing '+ch.name+' — streams cleared');
  }
}
async function refreshAll(){
  showToast('Refreshing all...');
  for(const ch of channels){if(!ch.channelId||ch.frozen)continue;try{const s=await fetchStreams(ch.channelId,true,ch.streams||[]);ch.streams=s;ch.lastFetched=new Date().toISOString();await saveCh(ch)}catch(e){ch.streams=[];ch.lastFetched=new Date().toISOString();await saveCh(ch);}}
  showToast('All channels refreshed.');
}

// Grid
function getColor(ch){const p=['#7c3aed','#0369a1','#047857','#b45309','#be123c','#0891b2','#9333ea','#c2410c'];if(ch.tags&&ch.tags[0]){let h=0;for(const c of ch.tags[0])h=((h<<5)-h)+c.charCodeAt(0);return p[Math.abs(h)%p.length]}return'#475569'}
function winStart(){const n=now();n.setMinutes(0,0,0);return n}
function statusOf(s){
  const n=now();
  if(s.liveNow) return'live';
  const e=addMin(s.start,s.dur);
  if(new Date(s.start)<=n&&e>n)return'live';
  if(new Date(s.start)>n)return'upcoming';
  return'ended';
}
function fmtT(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function fmtD(d){return new Date(d).toLocaleDateString([],{month:'short',day:'numeric'})}
function cd(s){const n=now(),st=statusOf(s);if(st==='live'){if(s.dur>=9000)return'LIVE 24/7';return Math.max(0,Math.round((addMin(s.start,s.dur)-n)/6e4))+'m left'}if(st==='upcoming'){const d=Math.round((new Date(s.start)-n)/6e4);return d<60?'in '+d+'m':'in '+Math.floor(d/60)+'h '+(d%60)+'m'}return'ended'}

// Assign overlapping streams to separate vertical lanes
function effectiveEnd(s){
  // for live streams with no real end time, use now+30min for layout purposes only
  const isReallyLive = s.liveNow && (now()-new Date(s.start))<24*60*60*1000;
  return isReallyLive ? addMin(now(),30) : addMin(s.start,s.dur);
}
function assignLanes(streams){
  const lanes=[];
  streams.forEach(s=>{
    let placed=false;
    for(let i=0;i<lanes.length;i++){
      const last=lanes[i][lanes[i].length-1];
      if(new Date(s.start)>=effectiveEnd(last)){
        lanes[i].push(s);s._lane=i;placed=true;break;
      }
    }
    if(!placed){lanes.push([s]);s._lane=lanes.length-1;}
  });
  return lanes.length;
}
function calcL(t,ws){return Math.max(0,(new Date(t)-ws)/(WMIN*6e4)*100)}
function calcW(s,ws){
  const total=WMIN*6e4,we=addMin(ws,WMIN);
  const sS=Math.max(new Date(s.start),ws);
  // for live streams use at least now+30min as end so block is always visible
  const estEnd=(s.liveNow||s.dur>=9000)?addMin(now(),30):addMin(s.start,s.dur);
  const sE=Math.min(estEnd,we);
  const d=sE-sS;return d<=0?0:d/total*100;
}

function renderGrid(){
  const grid=document.getElementById('guide-grid'),ws=winStart(),we=addMin(ws,WMIN);
  let h='<div class="time-header-row"><div class="channel-col-header">Channel</div><div class="time-slots-header">';
  for(let i=0;i<NSLOTS;i++)h+=`<div class="time-slot-label">${fmtT(addMin(ws,i*SMIN))}</div>`;
  h+='</div></div>';
  const fil=channels.filter(chVisible);
  if(!fil.length){h+=`<div style="padding:40px;text-align:center;color:#3a3a5a;font-size:13px;">No live or upcoming streams match the current filters.</div>`;grid.innerHTML=h;return}
  fil.forEach(ch=>{
    const col=getColor(ch);
    const vs=ch.streams.filter(s=>{
      const st=statusOf(s);
      if(st==='live') return true;
      return new Date(s.start)<we&&addMin(s.start,s.dur)>ws;
    });
    const tags=(ch.tags||[]).map(t=>`<span class="tag-badge">${esc(t)}</span>`).join('');
    const lang=ch.language?`<span class="lang-badge">${esc(ch.language)}</span>`:'';
    const adm=isAdmin?`<div class="channel-actions">
      <button class="ch-btn" onclick="refreshChannel(${ch.id})" title="Refresh">&#x21BB;</button>
      <button class="ch-btn" onclick="openChannelModal(${ch.id})" title="Edit">&#x270E;</button>
      <button class="ch-btn" onclick="removeChannel(${ch.id})" title="Remove">&#x2715;</button>
    </div>`:'';
    const numLanes=vs.length>0?assignLanes(vs):1;
    const LANE_H=64, LANE_PAD=4;
    const rowH=numLanes===1?68:numLanes*LANE_H+LANE_PAD;
    h+=`<div class="channel-row" style="min-height:${rowH}px"><div class="channel-info"><div class="channel-name">${esc(ch.name)}</div><div class="channel-meta">${lang}${tags}</div>${adm}</div><div class="programs-row" style="min-height:${rowH}px">`;
    if(!vs.length){h+=`<div class="empty-row"><div class="empty-msg">No streams in this window</div></div>`}
    else{
      vs.forEach(s=>{
        const left=calcL(s.start,ws),w=calcW(s,ws);if(w<0.5)return;
        const lane=s._lane||0;
        const topPx=numLanes===1?5:LANE_PAD+lane*LANE_H;
        const heightStyle=numLanes===1?`top:5px;bottom:5px`:`top:${topPx}px;height:${LANE_H-LANE_PAD*2}px`;
        const st=statusOf(s),bc=st==='live'?'badge-live':st==='upcoming'?'badge-soon':'badge-ended',bt=st==='live'?'LIVE':st==='upcoming'?'SOON':'ENDED';
        h+=`<a class="program-block ${st==='live'?'on-now':st}" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;${heightStyle};background:${col}22;border-color:${col}66;" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">
          <div class="prog-title" style="color:${col}cc">${esc(s.title)}</div>
          <div class="prog-meta"><span class="prog-time">${fmtT(s.start)}</span><span class="prog-badge ${bc}">${bt}</span></div>
          ${st!=='ended'?`<div class="countdown" style="color:${col}cc" id="cd-${s.id}">${cd(s)}</div>`:''}
        </a>`;
      });

      const no=(now()-ws)/(WMIN*6e4)*100;if(no>=0&&no<=100)h+=`<div class="now-line" style="left:${no.toFixed(2)}%"></div>`;
    }
    h+=`</div></div>`;
  });
  grid.innerHTML=h;
}


function updateCDs(){channels.forEach(ch=>ch.streams.forEach(s=>{const e=document.getElementById('cd-'+s.id);if(e)e.textContent=cd(s)}))}



function setFetchStatus(t,m){const e=document.getElementById('fetch-status');e.className='fetch-status '+t;e.textContent=m}
function clearFetchStatus(){const e=document.getElementById('fetch-status');e.className='fetch-status';e.textContent=''}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000)}

function openManageModal(){
  renderManageList();
  document.getElementById('modal-manage').classList.add('open');
}
function closeManageModal(){document.getElementById('modal-manage').classList.remove('open')}
function renderManageList(){
  const list=document.getElementById('manage-list');
  const sorted=[...channels].sort((a,b)=>a.name.localeCompare(b.name));
  if(!sorted.length){list.innerHTML='<div style="color:#3a3a5a;font-size:12px;text-align:center;padding:20px">No channels added yet.</div>';return}
  list.innerHTML=sorted.map(ch=>{
    const tags=(ch.tags||[]).join(', ')||'—';
    const lang=ch.language||'—';
    const streams=ch.streams?.length||0;
    const live=(ch.streams||[]).filter(s=>statusOf(s)==='live').length;
    const upcoming=(ch.streams||[]).filter(s=>statusOf(s)==='upcoming').length;
    const statusStr=live?`<span style="color:#e94560">${live} live</span>`:(upcoming?`<span style="color:#f0a500">${upcoming} upcoming</span>`:'<span style="color:#3a3a5a">no streams</span>');
    const frozenStyle=ch.frozen?'opacity:0.45;':'';
    const freezeLabel=ch.frozen?'&#x25B6;':'&#x23F8;';
    const freezeTitle=ch.frozen?'Unfreeze':'Freeze';
    return`<div class="manage-item" style="${frozenStyle}">
      <div class="manage-item-info">
        <div class="manage-item-name">${esc(ch.name)}${ch.frozen?'&nbsp;<span style="font-size:9px;background:#3a3a5a;color:#a0a0c0;padding:1px 6px;border-radius:2px;vertical-align:middle">FROZEN</span>':''}</div>
        <div class="manage-item-meta">Lang: ${esc(lang)} &nbsp;|&nbsp; Tags: ${esc(tags)} &nbsp;|&nbsp; ${statusStr}</div>
      </div>
      <div class="manage-item-actions">
        <button class="ch-btn" onclick="toggleFreeze(${ch.id})" title="${freezeTitle}" style="${ch.frozen?'border-color:#f0a500;color:#f0a500':''}">
          ${freezeLabel}
        </button>
        <button class="ch-btn" onclick="refreshChannel(${ch.id});renderManageList()" title="Refresh" ${ch.frozen?'disabled style="opacity:0.3;cursor:not-allowed"':''}>&#x21BB;</button>
        <button class="ch-btn" onclick="closeManageModal();openChannelModal(${ch.id})" title="Edit">&#x270E;</button>
        <button class="ch-btn" onclick="removeChannel(${ch.id})" title="Remove">&#x2715;</button>
      </div>
    </div>`;
  }).join('');
}

async function toggleFreeze(id){
  const ch=channels.find(c=>c.id===id);if(!ch)return;
  ch.frozen=!ch.frozen;
  await saveCh(ch);
  renderManageList();
  renderGrid();
  showToast(ch.name+(ch.frozen?' frozen — hidden from schedule':' unfrozen'));
}
